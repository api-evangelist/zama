aid: zama
name: Zama
description: >-
  Zama is an open-source cryptography company building state-of-the-art Fully
  Homomorphic Encryption (FHE) solutions for blockchain and AI. Its developer
  surface is a suite of libraries and protocols rather than a hosted REST API:
  TFHE-rs (a Rust implementation of TFHE), Concrete (a Python-to-FHE compiler),
  Concrete ML (privacy-preserving machine learning), fhEVM and the Zama Protocol
  for building confidential smart contracts and dApps on EVM-compatible chains,
  plus TypeScript SDKs (the fhEVM Relayer SDK and React SDK). Zama publishes the
  ERC-7984 confidential token standard, a developer hub, GitBook documentation,
  and an active open-source GitHub organization. This profile was surfaced as a
  portfolio company of Multicoin Capital and enriched from Zama's public
  developer surface.
